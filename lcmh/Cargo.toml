[package]
name = "lcmh"
version = "0.1.0"

edition = "2024"
rust-version = "1.85.0" # first version for the 2024 edition

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
rand = { version = "0.10.3", default-features = false, features = ["sys_rng"] }
rand_pcg = { version = "0.10.2", default-features = false }
rustc-hash = { version = "2.1.3", default-features = false }

[dev-dependencies]
